name: Central E2E PR Validation

on:
  pull_request:
    branches: [ main, dev ]

jobs:
  build-pr-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set lower case repository name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}:pr-${{ github.event.number }}

  call-central-e2e:
    needs: build-pr-image
    uses: 7-3-N-3-7/api/.github/workflows/e2e-pipeline.yml@main
    with:
      backend_tag: pr-${{ github.event.number }}
    secrets: inherit
