name: Sync GitHub Issue to Taiga

on:
  issues:
    types: [opened, edited, closed, reopened]

jobs:
  sync_to_taiga:
    runs-on: ubuntu-latest
    steps:
      - name: Sync GitHub Event to Taiga
        env:
          TAIGA_AUTH_TOKEN: ${{ secrets.TAIGA_AUTH_TOKEN }}
          TAIGA_PROJECT_ID: ${{ secrets.TAIGA_PROJECT_ID }}
          EVENT_PAYLOAD: ${{ toJson(github.event) }}
        run: |
          python3 -c '
          import os, json, urllib.request, urllib.parse
          
          event_str = os.environ.get("EVENT_PAYLOAD", "{}")
          try:
              event = json.loads(event_str)
          except Exception as e:
              print(f"Error parsing event: {e}")
              exit(1)
              
          action = event.get("action")
          issue = event.get("issue", {})
          
          # Extract embedded Taiga ID if it exists
          body = issue.get("body", "")
          taiga_id = None
          if "<!-- taiga-id:" in body:
              try:
                  # Very basic parsing for <!-- taiga-id: 1234 -->
                  start = body.find("<!-- taiga-id:") + 14
                  end = body.find("-->", start)
                  taiga_id = int(body[start:end].strip())
              except Exception:
                  pass
                  
          if not taiga_id:
              print("No Taiga ID linked. This might be a new GitHub-originated issue.")
              # We could create a new task in Taiga here, but for now we exit.
              # To implement two-way creation, you would POST to /api/v1/userstories
              exit(0)
              
          # Prepare API request
          taiga_url = f"https://api.taiga.io/api/v1/userstories/{taiga_id}"
          token = os.environ.get("TAIGA_AUTH_TOKEN")
          
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json"
          }
          
          print(f"Syncing GitHub Action \'{action}\' to Taiga Story #{taiga_id}")
          
          # We need the current version of the story to update it
          req = urllib.request.Request(taiga_url, headers=headers)
          try:
              with urllib.request.urlopen(req) as response:
                  story = json.loads(response.read().decode())
                  current_version = story.get("version")
          except Exception as e:
              print(f"Failed to fetch Taiga story: {e}")
              exit(1)
              
          # Prepare patch data
          data = {
              "version": current_version,
              "subject": issue.get("title"),
              "description": issue.get("body")
          }
          
          if action == "closed":
              # Assuming you have a status ID for closed. This requires a lookup in a real app.
              data["is_closed"] = True 
              
          req = urllib.request.Request(taiga_url, data=json.dumps(data).encode("utf-8"), headers=headers, method="PATCH")
          try:
              with urllib.request.urlopen(req) as response:
                  print("Successfully synced to Taiga.")
          except urllib.error.HTTPError as e:
              print(f"Taiga API Error: {e.code} - {e.read().decode()}")
              exit(1)
          '

