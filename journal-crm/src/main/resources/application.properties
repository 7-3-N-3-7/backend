server.port=8088
spring.application.name=journal-crm

# Use H2 in-memory database for local testing
spring.datasource.url=jdbc:h2:mem:journaldb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable H2 Console to view database (accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security - Disable basic auth for easy local testing initially (we can add JWT later)
spring.security.user.name=admin
spring.security.user.password=admin
