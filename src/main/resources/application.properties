# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8081

# ==========================================
# BUSINESS POSTGRESQL DATABASE
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5433/business_db
spring.datasource.username=app_user
spring.datasource.password=app_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# KEYCLOAK OAUTH2 RESOURCE SERVER
# ==========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://platform.localhost/auth/realms/EduJournal}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://platform.localhost/auth/realms/EduJournal/protocol/openid-connect/certs}

# ==========================================
# MONGODB (LOCALIZATION & TRANSCRIPTS)
# ==========================================
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=integrate_mongo
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.username=${MONGO_USER:mongo_user}
spring.data.mongodb.password=${MONGO_PASSWORD:mongo_password}

# ==========================================
# REDIS (REDISSON L2 CACHE)
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ==========================================
# APACHE KAFKA
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=integrate-group


logging.level.org.springframework.security=TRACE

server.error.include-message=always

# ==========================================
# KILL BILL & APACHE FINERACT & FINANCE JGIT
# ==========================================
killbill.url=${KILLBILL_URL:http://killbill:8080}
killbill.api-key=${KILLBILL_API_KEY:nordic-mind-key}
killbill.api-secret=${KILLBILL_API_SECRET:nordic-mind-secret}
killbill.username=${KILLBILL_USER:admin}
killbill.password=${KILLBILL_PASSWORD:password}
fineract.url=${FINERACT_URL:http://fineract:8080/fineract-provider/api/v1}
fineract.tenant-id=${FINERACT_TENANT_ID:default}
fineract.username=${FINERACT_USER:mifos}
fineract.password=${FINERACT_PASSWORD:password}
finance.remote.enabled=${FINANCE_REMOTE_ENABLED:false}
finance.git.repo-path=${FINANCE_GIT_REPO_PATH:./finance-repo}
