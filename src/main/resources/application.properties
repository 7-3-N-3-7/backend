# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8081

# ==========================================
# BUSINESS POSTGRESQL DATABASE
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/business_db
spring.datasource.username=app_user
spring.datasource.password=app_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# ZITADEL SECURITY / OAUTH2 RESOURCE SERVER
# ==========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080

# ==========================================
# MONGODB (LOCALIZATION & TRANSCRIPTS)
# ==========================================
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=integrate_mongo
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.username=${MONGO_USER:mongo_user}
spring.data.mongodb.password=${MONGO_PASSWORD:mongo_password}

# ==========================================
# REDIS (REDISSON L2 CACHE)
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ==========================================
# APACHE KAFKA
# ==========================================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=integrate-group
